# /etc/nginx/sites-available/caemble.conf

limit_req_zone $binary_remote_addr zone=caemble_req_per_ip:20m rate=17r/s;
limit_conn_zone $binary_remote_addr zone=caemble_conn_per_ip:20m;

log_format caemble_no_query '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_upgrade $caemble_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.caemble.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.caemble.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name code-to-cad.caemble.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://code-to-cad.caemble.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.caemble.com;

    ssl_certificate     /etc/letsencrypt/live/www.caemble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.caemble.com/privkey.pem;

    root /var/www/caemble/current;
    index index.html;

    access_log /var/log/nginx/caemble-access.log caemble_no_query;
    error_log  /var/log/nginx/caemble-error.log;

    limit_req  zone=caemble_req_per_ip burst=200 nodelay;
    limit_conn caemble_conn_per_ip 40;
    # General JSON request-body protection; tensor limits belong to the UI and CAE.
    client_max_body_size 96m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://code-to-cad.caemble.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $caemble_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The trailing slash removes the public /api/ prefix before FastAPI.
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        # Main-origin Workers may call only the same-origin API; external connections remain blocked.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'none'; connect-src 'self'; img-src 'none'; media-src 'none'; style-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # The evaluator must only be used from its separate origin.
    location = /runner.html {
        return 404;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # @jscad/regl-renderer generates optimized WebGL commands with Function.apply.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://code-to-cad.caemble.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code-to-cad.caemble.com;

    ssl_certificate     /etc/letsencrypt/live/www.caemble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.caemble.com/privkey.pem;

    root /var/www/caemble/current;

    access_log /var/log/nginx/caemble-runner-access.log caemble_no_query;
    error_log  /var/log/nginx/caemble-runner-error.log;

    limit_req  zone=caemble_req_per_ip burst=200 nodelay;
    limit_conn caemble_conn_per_ip 40;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /runner.html {
        try_files /runner.html =404;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'self'; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Calculation is a pure disposable Worker and must not inherit the CAD evaluator's
    # same-origin WASM fetch allowance. Vite keeps the source basename in its hashed entry name.
    location ~ ^/assets/runner\.worker-[A-Za-z0-9_-]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'none'; connect-src 'none'; img-src 'none'; media-src 'none'; style-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        # The isolated evaluator may fetch only revisioned assets such as the Manifold WASM from this origin.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src 'none'; connect-src 'self'; img-src 'none'; media-src 'none'; style-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # Do not expose the host SPA, API, cookies, or general endpoints here.
    location / {
        return 404;
    }
}
