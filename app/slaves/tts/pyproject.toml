[project]
name = "caemble-tts-slave"
version = "0.1.0"
description = "Isolated CPU English Kokoro v1.0 GPStation worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "caemble-runtime-sdk[slave]",
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "torch==2.7.0+cpu",
    "transformers>=4.49,<5",
    "huggingface-hub>=0.29,<1",
    "spacy>=3.8,<3.9",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
caemble-runtime-sdk = { path = "../../sdk", develop = true, extras = ["slave"] }
torch = { version = "2.7.0+cpu", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
