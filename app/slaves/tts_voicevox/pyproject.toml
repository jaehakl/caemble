[project]
name = "caemble-tts-voicevox-slave"
version = "0.1.0"
description = "Independent CPU and CUDA VOICEVOX GPStation worker"
requires-python = ">=3.11,<3.15"
dependencies = [
    "caemble-runtime-sdk[slave]",
    "python-dotenv>=1.1.1,<2",
    "pydantic-settings>=2.10.1,<3",
    "pydantic>=2.12.5,<3",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
caemble-runtime-sdk = { path = "../../../shared/sdk", develop = true, extras = ["slave"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
