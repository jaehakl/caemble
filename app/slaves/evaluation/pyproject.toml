[project]
name = "caemble-evaluation-slave"
version = "0.1.0"
description = "Node Measurement build and Calculation worker"
requires-python = ">=3.11,<3.15"
dependencies = ["caemble-runtime-sdk[server-slave]", "gpstation-v1-master-python-sdk", "prediction-contracts"]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
caemble-runtime-sdk = { path = "../../sdk", develop = true, extras = ["server-slave"] }
gpstation-v1-master-python-sdk = { path = "../../sdk/master/python", develop = true }
prediction-contracts = { path = "../../../shared/prediction_contracts", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
