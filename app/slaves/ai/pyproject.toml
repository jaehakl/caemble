[project]
name = "caemble-ai-slave"
version = "0.1.0"
description = "Caemble GPStation v1-compatible AI slave executable"
authors = [{ name = "Caemble" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "caemble-runtime-sdk[slave]",
    "python-dotenv>=1.1.1,<2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",
    "timm>=1.0.15,<2.0.0",
    "huggingface-hub>=1.5,<2.0.0",
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
    "diffusers>=0.38,<0.40",
    "transformers>=5.3,<6",
    "sentence-transformers>=5.3,<6.0.0",
    "protobuf>=3.20.3,<6.0.0",
    "sentencepiece>=0.1.91,<0.3.0",
    "llama-cpp-python>=0.3.28,<0.4.0",
    "openai>=2.54,<3.0.0",
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-runtime==13.1.80",
    "accelerate>=1.14.0,<2.0.0",
    "pillow>=12.2.0,<13.0.0",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
caemble-runtime-sdk = { path = "../../sdk", develop = true, extras = ["slave"] }
torch = { version = "2.7.0+cu128", source = "pytorch-gpu" }
torchvision = { version = "0.22.0+cu128", source = "pytorch-gpu" }
llama-cpp-python = { version = "^0.3.28", source = "llama-cpp-python-cu130" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "llama-cpp-python-cu130"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu130"
priority = "explicit"
