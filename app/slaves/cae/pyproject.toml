[project]
name = "caemble-cae-slave"
version = "0.1.0"
description = "Caemble GPStation v1-compatible CAE slave executable"
authors = [{ name = "Caemble" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "caemble-catalog",
    "caemble-runtime-sdk[slave]",
    "manifold3d==3.5.1",
    "numpy>=2.1,<3.0",
    "torch==2.13.0+cu126",
    "ucumvert==0.3.1",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
caemble-catalog = { path = "../../catalog", develop = true }
caemble-runtime-sdk = { path = "../../sdk", develop = true, extras = ["slave"] }
torch = { source = "pytorch-cu126" }

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
