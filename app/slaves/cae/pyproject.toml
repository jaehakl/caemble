[project]
name = "caemble-cae-slave"
version = "0.1.0"
description = "Caemble GPStation v1-compatible CAE slave executable"
authors = [{ name = "Caemble" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "caemble-catalog",
    "caemble-runtime-sdk[slave]",
    "numpy>=2.1,<3.0",
    "ucumvert==0.3.1",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
caemble-catalog = { path = "../../catalog", develop = true }
caemble-runtime-sdk = { path = "../../sdk", develop = true, extras = ["slave"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
