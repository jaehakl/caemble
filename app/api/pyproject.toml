[project]
name = "caemble-api"
version = "0.0.1"
description = "Caemble"
authors = [
    {name = "Jaehak Lee", email = "jaehak@qutat.com"},
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "sqlalchemy>=2.0.41,<3.0.0",
    "uvicorn>=0.34.3,<0.35.0",
    "fastapi>=0.115.14,<0.116.0",
    "pgvector>=0.4.1,<0.5.0",
    "asyncpg>=0.30.0,<0.31.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "requests>=2.32",
    "google-auth>=2.30",
    "pyjwt>=2.10.1,<3.0.0",
    "pydantic[email]>=2.12.5,<3.0.0",
    "alembic (>=1.16,<2.0)",
    "caemble-runtime-sdk",
    "websockets>=12,<16",
    "tree-sitter (>=0.25,<0.27)",
    "tree-sitter-typescript (>=0.23,<0.24)",
    "caemble-catalog",
    "cryptography>=45,<50",
    "openai>=2.54,<3",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
caemble-runtime-sdk = { path = "../sdk", develop = true }
caemble-catalog = { path = "../catalog", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8,<9)",
    "pytest-asyncio (>=1,<2)",
    "httpx (>=0.28,<0.29)"
]
