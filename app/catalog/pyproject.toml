[project]
name = "caemble-catalog"
version = "0.1.0"
description = "Versioned read-only CAE catalog shared by Caemble API and solver workers."
requires-python = ">=3.11,<3.15"
dependencies = ["ucumvert==0.3.1"]

[project.scripts]
catalogctl = "caemble_catalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caemble_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"caemble_catalog/catalog.sqlite3" = "caemble_catalog/catalog.sqlite3"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
markers = [
    "slow: database or end-to-end integration coverage",
    "live: opt-in test that calls an external service",
]
